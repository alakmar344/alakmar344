name: Update Banner

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:      # allows manual runs

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate banner.svg from GitHub data
        run: python3 generate_banner.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet banner.svg; then
            echo "No changes to banner.svg"
          else
            git add banner.svg
            git commit -m "chore: daily banner update $(date -u +'%Y-%m-%d')"
            git push
          fi
